<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3º COMANDO REGIONAL - CBMGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Paleta de Cores */
      --primary-red: #B30000;
      --primary-red-hover: #8F0000;
      --primary-red-soft: #FEF2F2;
      --accent-orange: #FF6A00;
      --accent-orange-dark: #E05A00;
      --header-bg: #F3F4F6;
      --nav-bg: #B30000;
      --body-bg: #D5D7DA;
      --surface-white: #FFFFFF;
      --card-bg: #F8FAFC;
      --footer-bg: #F3F4F6;
      --border-color: #CBD5E1;
      --border-strong: #94A3B8;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6B7280;
      --status-green-dot: #10B981;
      --status-green-text: #15803D;
      --status-green-bg: #DCFCE7;
      --status-red-text: #B30000;
      --status-red-bg: #FEE2E2;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-card: 0 3px 10px rgba(15, 23, 42, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--body-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Texto acessível apenas para leitores de tela */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ================= TOP HEADER ================= */
    .top-header {
      background-color: var(--header-bg);
      border-bottom: 1px solid #DCDEE2;
      padding: 10px 24px;
    }

    .header-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* Logo Esquerda */
    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 170px;
    }

    .logo-left-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-subtext {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-subtext span:first-child {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .brand-subtext span:last-child {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary-red);
      letter-spacing: 0.02em;
    }

    /* Título Central com Imagem */
    .header-title-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title-img {
      max-height: 76px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
    }

    /* Logo Direita */
    .brand-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 170px;
    }

    .logo-right-img {
      height: 66px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* ================= BARRA DE NAVEGAÇÃO ================= */
    .navbar {
      background-color: var(--nav-bg);
      border-bottom: 2px solid #8A0000;
      box-shadow: 0 2px 6px rgba(179, 0, 0, 0.22);
      padding: 0 24px;
      position: relative;
      z-index: 50;
    }

    .nav-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      flex-wrap: wrap;
    }

    .nav-item {
      position: relative;
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    .nav-item.active {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .nav-item.active:hover {
      background-color: var(--accent-orange-dark);
      color: #FFFFFF;
    }

    /* Dropdown (Menu Suspenso) */
    .nav-dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-caret {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .nav-dropdown:hover .dropdown-caret,
    .nav-dropdown.open .dropdown-caret {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 230px;
      background-color: var(--surface-white);
      border: 1px solid #CBD5E1;
      border-top: 3px solid var(--accent-orange);
      border-radius: 9px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.16);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 3px;
      z-index: 100;
      animation: fadeDrop 0.15s ease-out;
    }

    .dropdown-menu::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      right: 0;
      height: 10px;
    }

    @keyframes fadeDrop {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nav-dropdown:hover .dropdown-menu,
    .nav-dropdown.open .dropdown-menu {
      display: flex;
    }

    .dropdown-item {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      text-align: left;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dropdown-item:hover {
      background-color: var(--primary-red-soft);
      color: var(--primary-red);
    }

    .dropdown-item.active {
      background-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* Pill de Status da Planilha na Barra de Menu */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background-color: var(--surface-white);
      border: 1px solid #FCA5A5;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .sync-pill:hover {
      border-color: #FFFFFF;
      background-color: #FFF5F5;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--status-green-dot);
    }

    .sync-dot.loading {
      background-color: var(--accent-orange);
      animation: pulseDot 0.9s infinite alternate;
    }

    .sync-dot.error {
      background-color: var(--primary-red);
    }

    @keyframes pulseDot {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }

    .sync-icon {
      width: 12px;
      height: 12px;
      color: var(--text-muted);
    }

    /* ================= ÁREA PRINCIPAL ================= */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .main-white-canvas {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      background-color: var(--surface-white);
      border-radius: 14px;
      box-shadow: var(--shadow-md);
      border: 1px solid #E5E7EB;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
    }

    /* ================= ORGANOGRAMA / UNIDADES (HOME) ================= */
    .section-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .section-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Card de Destaque: Comando Regional */
    .regional-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    .regional-card {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
      border: 1px solid #CBD5E1;
      border-top: 5px solid var(--primary-red);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 6px 18px rgba(179, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 22px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .regional-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(179, 0, 0, 0.12);
    }

    .regional-photo-frame {
      width: 112px;
      height: 134px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--primary-red);
      background-color: #E2E8F0;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .regional-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .regional-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .unit-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .unit-tag {
      display: inline-block;
      background-color: var(--primary-red);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sei-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #EEF2FF;
      color: #1E3A8A;
      border: 1px solid #C7D2FE;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .regional-unit-name {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .commander-role {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-red);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-top: 2px;
    }

    .commander-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .contact-list {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .contact-item svg {
      width: 14px;
      height: 14px;
      color: var(--primary-red);
      flex-shrink: 0;
    }

    .contact-item a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-item a:hover {
      color: var(--primary-red);
      text-decoration: underline;
    }

    /* Conector Visual do Organograma */
    .org-connector {
      width: 100%;
      max-width: 1120px;
      height: 34px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .org-connector::before {
      content: '';
      width: 2px;
      height: 17px;
      background-color: #94A3B8;
    }

    .org-connector::after {
      content: '';
      position: absolute;
      top: 17px;
      left: 10%;
      right: 10%;
      height: 2px;
      background-color: #94A3B8;
    }

    /* Grid das Unidades Subordinadas (OBMs) */
    .units-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 4px;
    }

    .unit-card {
      background-color: var(--card-bg);
      border: 1px solid #D8DEE6;
      border-top: 4px solid var(--primary-red);
      border-radius: 11px;
      padding: 18px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .unit-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
      border-color: #BFC8D4;
      background-color: #FFFFFF;
    }

    .unit-card-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .unit-sigla-pill {
      background-color: var(--primary-red-soft);
      color: var(--primary-red);
      border: 1px solid #FECACA;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .unit-photo-frame {
      width: 96px;
      height: 114px;
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid #CBD5E1;
      background-color: #E2E8F0;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .unit-card:hover .unit-photo-frame {
      border-color: var(--primary-red);
    }

    .unit-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .unit-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.35;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unit-commander-box {
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 10px 0;
    }

    .unit-commander-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-red);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .unit-commander-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .unit-contacts {
      width: 100%;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dashed #CBD5E1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
      text-align: left;
    }

    .unit-contacts .contact-item {
      word-break: break-word;
    }

    /* ================= VIEW: VIATURAS ATIVAS (ABAS + LISTVIEW) ================= */
    .view-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #E5E7EB;
    }

    .view-title-block h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .view-title-block p {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .summary-badges {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #E2E8F0;
      background-color: #F8FAFC;
      color: var(--text-secondary);
    }

    .stat-chip.ativa {
      background-color: var(--status-green-bg);
      border-color: #86EFAC;
      color: var(--status-green-text);
    }

    .stat-chip.baixada {
      background-color: var(--status-red-bg);
      border-color: #FECACA;
      color: var(--status-red-text);
    }

    /* Sub-abas das Unidades */
    .subtabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .subtabs-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subtab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      background-color: #F8FAFC;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .subtab-btn:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
      background-color: var(--primary-red-soft);
    }

    .subtab-btn.active {
      background-color: var(--primary-red);
      border-color: var(--primary-red);
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(179, 0, 0, 0.22);
    }

    .subtab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background-color: rgba(15, 23, 42, 0.08);
      color: inherit;
    }

    .subtab-btn.active .subtab-count {
      background-color: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* Campo de Filtro Rápido */
    .search-box {
      position: relative;
      min-width: 240px;
      flex: 0 1 300px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-primary);
      background-color: #F8FAFC;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary-red);
      background-color: #FFFFFF;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ListView (Tabela Estilizada) */
    .listview-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      background-color: #FFFFFF;
    }

    .listview-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .listview-table thead {
      background-color: #F1F5F9;
      border-bottom: 2px solid #CBD5E1;
    }

    .listview-table th {
      padding: 12px 14px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .listview-table tbody tr {
      border-bottom: 1px solid #E2E8F0;
      transition: background-color 0.15s ease;
    }

    .listview-table tbody tr:last-child {
      border-bottom: none;
    }

    .listview-table tbody tr:hover {
      background-color: #F8FAFC;
    }

    .listview-table td {
      padding: 12px 14px;
      color: var(--text-primary);
      vertical-align: middle;
    }

    /* Cores exigidas para a Coluna F (ATIVA = Verde / BAIXADA = Vermelho) */
    .status-ativa {
      color: var(--status-green-text);
      background-color: var(--status-green-bg);
      border: 1px solid #86EFAC;
      font-weight: 800;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-block;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .status-baixada {
      color: var(--status-red-text);
      background-color: var(--status-red-bg);
      border: 1px solid #FCA5A5;
      font-weight: 800;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-block;
      letter-spacing: 0.03em;

    function atualizarStatusSync(estado, texto) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (!dot || !label) return;
      dot.className = 'sync-dot';

      label.textContent = texto;

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizarTexto(valor) {
      return String(valor || '')
        .trim()
        .toUpperCase()
        .replace(/[°º]/g, 'º')
        .replace(/[ª]/g, 'ª')
        .replace(/\s+/g, ' ');
    }

    function parseCSVText(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i];
        const nextCh = csvText[i + 1];

        if (ch === '"') {
          if (inQuotes && nextCh === '"') {
            currentField += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          currentRow.push(currentField.trim());
          currentField = '';
        } else if ((ch === '\r' || ch === '\n') && !inQuotes) {
          if (ch === '\r' && nextCh === '\n') {
            i++;
          }
          currentRow.push(currentField.trim());
          if (currentRow.some((cell) => cell !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentField = '';
        } else {
          currentField += ch;
        }
      }

      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        if (currentRow.some((cell) => cell !== '')) {
          rows.push(currentRow);
        }
      }

      if (rows.length === 0) {
        throw new Error('A aba da planilha retornou sem linhas de dados.');
      }

      const headers = rows[0].slice(0, 6).map((h, idx) => h || `Coluna ${String.fromCharCode(65 + idx)}`);
      const dataRows = rows
        .slice(1)
        .map((r) => [0, 1, 2, 3, 4, 5].map((i) => r[i] || ''))
        .filter((row) => row.some((val) => val !== ''));

      return { headers, rows: dataRows, rawRows: rows };
    }

    function processarGvizTable(json) {
      if (!json || !json.table || json.status === 'error') {
        throw new Error(json?.errors?.[0]?.detailed_message || 'Resposta inválida da planilha.');
      }

      const cols = (json.table.cols || []).slice(0, 6).map((c, idx) =>
        (c && c.label ? c.label.trim() : '') || `Coluna ${String.fromCharCode(65 + idx)}`
      );

      const rows = (json.table.rows || [])
        .map((r) => {
          const cells = r.c || [];
          return [0, 1, 2, 3, 4, 5].map((i) => {
            const cell = cells[i];
            if (!cell) return '';
            return cell.f !== undefined && cell.f !== null
              ? String(cell.f).trim()
              : cell.v !== null && cell.v !== undefined
              ? String(cell.v).trim()
              : '';
          });
        })
        .filter((row) => row.some((val) => val !== ''));

      const rawRows = [cols, ...rows];
      return { headers: cols, rows, rawRows };
    }

        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = window.google.visualization.Query || {};

        const previousHandler = window.google.visualization.Query.setResponse;

        const limpar = () => {
          if (script.parentNode) script.parentNode.removeChild(script);
          window.google.visualization.Query.setResponse = previousHandler;
        };

        const timer = setTimeout(() => {
          if (!finalizado) {
            finalizado = true;
            limpar();
            reject(new Error('Tempo esgotado ao carregar os dados da planilha via JSONP.'));
          }
        }, 12000);

        window.google.visualization.Query.setResponse = function (json) {
          if (finalizado) return;
          finalizado = true;
          clearTimeout(timer);
          limpar();
          try {
            resolve(processarGvizTable(json));
          } catch (e) {
            reject(e);
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${encodeURIComponent(range)}&headers=1&_=${Date.now()}`;
        script.onerror = () => {
          if (finalizado) return;
          finalizado = true;
          clearTimeout(timer);
          limpar();
          reject(new Error('Falha ao carregar script do Google Sheets.'));
        };

        document.head.appendChild(script);
      });
    }

    async function carregarViaCSVFetch(spreadsheetId, sheetName, range = 'A:F') {
      const urls = [
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&range=${encodeURIComponent(range)}`,
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&sheet=${encodeURIComponent(sheetName)}`
      ];

      let ultimoErro = null;
      for (const url of urls) {
        try {
          const resp = await fetch(url, { cache: 'no-store' });
          if (!resp.ok) {
            ultimoErro = new Error(`HTTP ${resp.status}`);
            continue;
          }
          const text = await resp.text();
          if (!text || text.includes('<!DOCTYPE html>') || text.includes('<html')) {
            ultimoErro = new Error('Resposta HTML em vez de CSV.');
            continue;
          }
          return parseCSVText(text);
        } catch (err) {
          ultimoErro = err;
        }
      }
      throw ultimoErro || new Error('Não foi possível obter o CSV da planilha.');
    }

    async function carregarAbaGoogleSheets(spreadsheetId, sheetName, range = 'A:F') {
      const isFileProtocol = window.location.protocol === 'file:';

      if (isFileProtocol) {
        try {
          return await carregarViaJSONP(spreadsheetId, sheetName, range);
        } catch (jsonpErr) {
          return await carregarViaCSVFetch(spreadsheetId, sheetName, range);
        }
      }

      try {
        return await carregarViaCSVFetch(spreadsheetId, sheetName, range);
      } catch (csvErr) {
        return await carregarViaJSONP(spreadsheetId, sheetName, range);
      }
    }

    function desenharInterfaceViaturas() {
      const appView = document.getElementById('app-view');

      const contadores = {};
      VIATURAS_STATE.abasUnidades.forEach((unidade) => {
        const alvo = normalizarTexto(unidade);
        contadores[unidade] = rows.filter((r) => normalizarTexto(r[2]) === alvo).length;
      });

      const alvoAba = normalizarTexto(VIATURAS_STATE.abaAtiva);
      const linhasDaUnidade = rows.filter((r) => normalizarTexto(r[2]) === alvoAba);

      const totalAtivas = linhasDaUnidade.filter((r) => normalizarTexto(r[5]) === 'ATIVA').length;
      const totalBaixadas = linhasDaUnidade.filter((r) => normalizarTexto(r[5]) === 'BAIXADA').length;

      const termo = VIATURAS_STATE.termoBusca.trim().toLowerCase();
      const linhasFiltradas = termo
        ? linhasDaUnidade.filter((r) => r.some((cel) => String(cel).toLowerCase().includes(termo)))
        : linhasDaUnidade;

            <span>${unidade}</span>

      const thHTML = headers.slice(0, 6).map((h) => `<th>${escapeHTML(h)}</th>`).join('');

        tbodyHTML = `

          </div>

            <span class="stat-chip">Total na Unidade: <strong>${linhasDaUnidade.length}</strong></span>
            <span class="stat-chip ativa">Ativas: <strong>${totalAtivas}</strong></span>
            <span class="stat-chip baixada">Baixadas: <strong>${totalBaixadas}</strong></span>
          </div>
        </div>

          <div class="subtabs-list" role="tablist" aria-label="Unidades do 3º CRBM">
            ${abasHTML}
          </div>

          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

        try {
          const dados = await carregarAbaGoogleSheets(
            FONTES_PLANILHAS.controleEfetivo.id,
            cfgAtual.guiaPlanilha,
            FONTES_PLANILHAS.controleEfetivo.areaAtuacaoRange
          );
          // Intervalo A33:F47 possui 15 linhas no total (1 cabecalho + ate 14 linhas)
          const rawLimitado = (dados.rawRows || [dados.headers, ...dados.rows]).slice(0, 15);
          const cabecalho = rawLimitado[0] || ['A', 'B', 'C', 'D', 'E', 'F'];
          const corpo = rawLimitado.slice(1).map((r) => [0, 1, 2, 3, 4, 5].map((i) => r[i] || ''));

          CACHE_DADOS.areaAtuacao[cacheKey] = {
            headers: cabecalho,
            rows: corpo
          };
          atualizarStatusSync('ok', 'Planilha Sincronizada');
        } catch (err) {
          atualizarStatusSync('error', 'Erro na Planilha');
          appView.innerHTML = `
            <div class="state-box error">
              <strong>Não foi possível carregar os dados de Área de Atuação da guia "${escapeHTML(cfgAtual.guiaPlanilha)}".</strong><br/><br/>
              ${escapeHTML(err.message)}<br/><br/>
              <small>Verifique se a planilha está compartilhada como "Qualquer pessoa com o link pode visualizar" e se a aba se chama exatamente <strong>${escapeHTML(cfgAtual.guiaPlanilha)}</strong>.</small>
            </div>
          `;
          return;
        }
      }

      desenharInterfaceAreaAtuacao(cfgAtual);
    }

    function desenharInterfaceAreaAtuacao(cfgAtual) {
      const appView = document.getElementById('app-view');
      const { headers, rows } = CACHE_DADOS.areaAtuacao[cfgAtual.guiaPlanilha] || { headers: [], rows: [] };

      const termo = AREA_ATUACAO_STATE.termoBusca.trim().toLowerCase();
      const linhasFiltradas = termo
        ? rows.filter((r) => r.some((cel) => String(cel).toLowerCase().includes(termo)))
        : rows;

      const abasHTML = AREA_ATUACAO_STATE.abasConfig.map((item) => {
        const isActive = item.aba === AREA_ATUACAO_STATE.abaAtiva;
        return `
          <button type="button" class="subtab-btn ${isActive ? 'active' : ''}" data-area-tab="${escapeHTML(item.aba)}" title="Tabela: ${escapeHTML(item.guiaPlanilha)}">
            <span>${escapeHTML(item.aba)}</span>
          </button>
        `;
      }).join('');

      const thHTML = [0, 1, 2, 3, 4, 5].map((idx) => {
        const labelCol = headers[idx] || `Coluna ${String.fromCharCode(65 + idx)}`;
        return `<th>${escapeHTML(labelCol)}</th>`;
      }).join('');

      let tbodyHTML = '';
      if (linhasFiltradas.length === 0) {
        tbodyHTML = `
          <tr>
            <td colspan="6" class="state-box">
              Nenhum registro encontrado em <strong>${escapeHTML(cfgAtual.guiaPlanilha)}</strong> (A33:F47)${termo ? ` com o filtro "${escapeHTML(AREA_ATUACAO_STATE.termoBusca)}"` : ''}.
            </td>
          </tr>
        `;
      } else {
        tbodyHTML = linhasFiltradas.map((row) => {
          const colsHTML = [0, 1, 2, 3, 4, 5].map((colIdx) => {
            const valor = row[colIdx] || '-';
            if (colIdx === 0) {
              return `<td><strong>${escapeHTML(valor)}</strong></td>`;
            }
            return `<td>${escapeHTML(valor)}</td>`;
          }).join('');

          return `<tr>${colsHTML}</tr>`;
        }).join('');
      }

      appView.innerHTML = `
        <div class="view-toolbar">
          <div class="view-title-block">
            <h2>Serviço — Área de Atuação (${escapeHTML(cfgAtual.aba)})</h2>
            <p>Tabela: <strong>${escapeHTML(cfgAtual.guiaPlanilha)}</strong> • Intervalo <strong>A33:F47</strong></p>
          </div>

          <div class="summary-badges">
            <span class="stat-chip">Registros Exibidos: <strong>${linhasFiltradas.length}</strong></span>
          </div>
        </div>

        <div class="subtabs-bar">
          <div class="subtabs-list" role="tablist" aria-label="Unidades de Área de Atuação">
            ${abasHTML}
          </div>

          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="input-busca-area" placeholder="Filtrar em ${escapeHTML(cfgAtual.aba)}..." value="${escapeHTML(AREA_ATUACAO_STATE.termoBusca)}" />
          </div>
        </div>

        <div class="listview-container">
          <table class="listview-table">
            <thead>
              <tr>${thHTML}</tr>
            </thead>
            <tbody>
              ${tbodyHTML}
            </tbody>
          </table>
        </div>
      `;

      appView.querySelectorAll('.subtab-btn[data-area-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          AREA_ATUACAO_STATE.abaAtiva = btn.getAttribute('data-area-tab');
          renderAreaAtuacaoView(false);
        });
      });

      const inputBusca = document.getElementById('input-busca-area');
      if (inputBusca) {
        inputBusca.addEventListener('input', (e) => {
          const cursorPos = e.target.selectionStart;
          AREA_ATUACAO_STATE.termoBusca = e.target.value;
          desenharInterfaceAreaAtuacao(cfgAtual);
          const novoInput = document.getElementById('input-busca-area');
          if (novoInput) {
            novoInput.focus();
            novoInput.setSelectionRange(cursorPos, cursorPos);
          }
        });
      }
    }

    // =========================================================================
    // 6. ROTEAMENTO E NAVEGAÇÃO PRINCIPAL
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      const directNavButtons = document.querySelectorAll('.nav-item[data-route]');
      const dropdowns = document.querySelectorAll('.nav-dropdown');
      const dropdownToggles = document.querySelectorAll('.nav-dropdown-toggle');
      const dropdownItems = document.querySelectorAll('.dropdown-item');
      const allMainNavButtons = document.querySelectorAll('.nav-item');
      const btnSync = document.getElementById('btn-sync');
      const appView = document.getElementById('app-view');

      let rotaAtual = 'home';

      function clearActiveStates() {
        allMainNavButtons.forEach((btn) => btn.classList.remove('active'));
        dropdownItems.forEach((item) => item.classList.remove('active'));
      }

      function closeAllDropdowns() {
        dropdowns.forEach((dd) => {
          dd.classList.remove('open');
          const toggle = dd.querySelector('.nav-dropdown-toggle');
          if (toggle) toggle.setAttribute('aria-expanded', 'false');
        });
      }

      function renderView(route, forcarRecarga = false) {
        rotaAtual = route;
        appView.setAttribute('data-current-view', route);

        if (route === 'home') {
          appView.innerHTML = renderHomeView();
        } else if (route === 'viaturas-ativas') {
          renderViaturasAtivasView(forcarRecarga);
        } else if (route === 'inspecao-tecnica') {
          renderInspecaoTecnicaView();
        } else if (route === 'estatisticas-operacional') {
          renderEstatisticasOperacionalView();
        } else if (route === 'estatisticas-secip') {
          renderEstatisticasSecipView();
        } else if (route === 'recursos-humanos') {
          renderRecursosHumanosView(forcarRecarga);
        } else if (route === 'area-atuacao') {
          renderAreaAtuacaoView(forcarRecarga);
        } else {
          appView.innerHTML = '';
        }
      }

      directNavButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          clearActiveStates();
          closeAllDropdowns();
          btn.classList.add('active');
          renderView(btn.getAttribute('data-route'));
        });
      });

      dropdownToggles.forEach((toggle) => {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const parentDropdown = toggle.closest('.nav-dropdown');
          const isOpen = parentDropdown.classList.contains('open');
          closeAllDropdowns();
          if (!isOpen) {
            parentDropdown.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
          }
        });
      });

      dropdownItems.forEach((item) => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          clearActiveStates();
          closeAllDropdowns();

          item.classList.add('active');
          const parentDropdown = item.closest('.nav-dropdown');
          const parentToggle = parentDropdown.querySelector('.nav-dropdown-toggle');
          if (parentToggle) parentToggle.classList.add('active');

          renderView(item.getAttribute('data-route'));
        });
      });

      btnSync.addEventListener('click', () => {
        if (rotaAtual === 'viaturas-ativas') {
          renderViaturasAtivasView(true);
        } else if (rotaAtual === 'inspecao-tecnica') {
          const iframe = document.getElementById('iframe-inspecao-tecnica');
          if (iframe) iframe.src = RELATORIOS_EMBED.inspecaoTecnica.embedUrl;
        } else if (rotaAtual === 'estatisticas-operacional') {
          const iframe = document.getElementById('iframe-estatisticas-operacional');
          if (iframe) iframe.src = RELATORIOS_EMBED.estatisticasOperacional.embedUrl;
        } else if (rotaAtual === 'estatisticas-secip') {
          const iframe = document.getElementById('iframe-estatisticas-secip');
          if (iframe) iframe.src = RELATORIOS_EMBED.estatisticasSecip.embedUrl;
        } else if (rotaAtual === 'recursos-humanos') {
          renderRecursosHumanosView(true);
        } else if (rotaAtual === 'area-atuacao') {
          renderAreaAtuacaoView(true);
        } else {
          CACHE_DADOS.viaturas = null;
          atualizarStatusSync('loading', 'Sincronizando...');
          carregarAbaGoogleSheets(
            FONTES_PLANILHAS.basedados.id,
            FONTES_PLANILHAS.basedados.abas.viaturas,
            'A:F'
          )
            .then((dados) => {
              CACHE_DADOS.viaturas = dados;
              atualizarStatusSync('ok', 'Planilha Sincronizada');
            })
            .catch(() => {
              atualizarStatusSync('error', 'Erro na Planilha');
            });
        }
      });

      document.addEventListener('click', () => {
        closeAllDropdowns();
      });

      renderView('home');
    });
  </script>
</body>
</html>
